name: CI / Deploy

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Environment — override these in repo Settings → Secrets and variables → Actions
# ---------------------------------------------------------------------------
env:
  GCP_REGION: us-central1
  AR_REPOSITORY: gh-600-prep          # Artifact Registry repository name
  CLOUD_RUN_SERVICE: gh-600-prep      # Cloud Run service name

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify knowledge base present
        run: |
          count=$(ls prompts/knowledge/domain-*.md 2>/dev/null | wc -l)
          echo "Domain knowledge files found: $count"
          if [ "$count" -lt 6 ]; then
            echo "⚠️  Less than 6 domain knowledge files — run 'npm run fetch-knowledge' to refresh."
          fi

  deploy:
    name: Deploy to Cloud Run
    needs: [test, build]
    # Only deploy on direct pushes to main (not PRs, not feature branches)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "OPENAI_MODEL=gpt-5.5,OPENAI_REASONING_EFFORT=medium,OPENAI_REVIEW_REASONING_EFFORT=high,GCS_BUCKET=${{ secrets.GCS_BUCKET }}" \
            --set-secrets "OPENAI_API_KEY=openai-api-key:latest" \
            --quiet

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.GCP_REGION }} --format "value(status.url)")
          echo "Deployed to: $URL"
          curl -fsS "${URL}/healthz" | grep '"ok":true'

